<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login">
    <form id="login" class="login-card">
        <div class="brand">R<span>•</span>ADMIN</div>
        <h1>Admin Panel</h1>
        <p>Sign in to manage your Roblox game.</p><input id="username" placeholder="Username" autocomplete="username"
            required><input id="password" type="password" placeholder="Password" autocomplete="current-password"
            required><button>Sign in</button>
        <div id="error" class="error"></div>
    </form>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
