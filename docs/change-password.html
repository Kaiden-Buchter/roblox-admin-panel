<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Change temporary password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
    <form id="change-password" class="login-card">
        <div class="top-banner-brand">R<span>•</span>ADMIN <small>SECURITY CHECK</small></div>
        <h1>Create your password</h1>
        <p>Your temporary password must be replaced before you can access the administration panel.</p>
        <input id="currentPassword" type="password" placeholder="Temporary password" autocomplete="current-password" required>
        <input id="newPassword" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
        <input id="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
        <button>Save new password</button>
        <div id="error" class="error"></div>
    </form>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/change-password.js"></script>
</body>
</html>
