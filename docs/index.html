<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Roblox Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="shell">
        <aside>
            <div class="brand">R<span>•</span>ADMIN</div>
            <nav><button data-view="dashboard">Dashboard</button><button data-view="active">Active
                    Players</button><button data-view="players">Players</button><button
                    data-view="servers">Servers</button><button data-view="bans">Bans</button><button
                    data-view="audit">Audit Logs</button></nav><button id="logout" class="ghost">Log out</button>
        </aside>
        <main>
            <header>
                <div>
                    <p class="eyebrow">GAME OPERATIONS</p>
                    <h1 id="title">Dashboard</h1>
                </div>
                <div class="header-tools">
                    <div id="clock"></div>
                    <div class="profile-control">
                        <button id="profile-button" class="profile-button" aria-expanded="false" aria-haspopup="true">
                            <span id="profile-avatar">A</span><span id="profile-name">Account</span><span class="profile-chevron">⌄</span>
                        </button>
                        <div id="profile-menu" class="profile-menu" hidden>
                            <div class="profile-menu-head"><span id="profile-menu-avatar">A</span><div><b id="profile-menu-name">Account</b><small id="profile-menu-role">Admin</small></div></div>
                            <button id="account-settings" class="profile-menu-item">Account settings</button>
                            <button id="profile-logout" class="profile-menu-item">Log out</button>
                        </div>
                    </div>
                </div>
            </header>
            <section id="app"></section>
        </main>
    </div>
    <div id="toast"></div>
    <div id="modal-root" aria-live="polite"></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js?v=20260919-2"></script>
</body>

</html>
